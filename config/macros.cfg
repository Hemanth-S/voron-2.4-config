
#####################################################################
#   Macros
#####################################################################
[gcode_macro PARK]
gcode:
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30  

[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28
    PARK
    RESTORE_GCODE_STATE NAME=STATE_G32
   
[gcode_macro PRINT_START]
description: Heat, home, level, hot wipe, touch-home (true Z0 at contact), adaptive mesh, purge
# Z0 comes from CARTOGRAPHER_TOUCH_HOME (the nozzle touching the plate), not the scan model:
# scan height drifts with coil temperature and the paper test is done cold. The plugin
# refuses to touch above 150 C (+2); 150 also softens residue on the tip without oozing.
gcode:
    {% set BED = params.BED|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(200)|float %}
    {% set SOAK = params.SOAK|default(0)|int %}      ; heat-soak minutes (ABS/ASA: 10+)
    {% set TOUCH = params.TOUCH|default(1)|int %}    ; 1 = Cartographer touch for exact Z0 (TOUCH=0 = scan-only Z)
    {% set TOUCH_TEMP = 150 %}

    _RESET_RUNTIME                       ; clear PA/M221/M220/offset/accel left by earlier prints or tests
    # Scan model per bed regime (no probe temperature compensation; the coil drifts ~0.02 mm/C):
    #   default - PLA, bed 55, coil ~40 C;  asa - ASA/ABS, bed 100, enclosure closed, 10 min soak.
    # Must load before the first G28 (scan homing uses it).
    # 2026-10-21: the PLA 'default' model was DELETED. The probe was re-seated and the old model
    # was ~0.7 mm off. Until it is recalibrated, PLA-temperature prints stop here before heating.
    {% set scan_models = printer.cartographer.scan.models.split(', ') %}
    {% if BED >= 90 %}
        CARTOGRAPHER_SCAN_MODEL LOAD=asa
    {% elif 'default' in scan_models %}
        CARTOGRAPHER_SCAN_MODEL LOAD=default
    {% else %}
        { action_raise_error("No PLA scan model ('default'): deleted 2026-10-21 after the probe was re-seated. Calibrate it first: bed 55, nozzle 150, home + QGL, then CARTOGRAPHER_SCAN_CALIBRATE MODEL=default METHOD=touch and SAVE_CONFIG.") }
    {% endif %}
    M117 Heating
    M140 S{BED}
    M104 S{TOUCH_TEMP}
    G90
    G28                                  ; coarse home (Cartographer scan)
    G0 X175 Y175 Z3 F6000                ; park low so the coil warms with the bed (less drift)
    M190 S{BED}
    {% if SOAK > 0 %}
        M117 Heat soak {SOAK} min
        G4 P{SOAK * 60000}
    {% endif %}

    M117 Levelling
    QUAD_GANTRY_LEVEL
    G28 Z

    {% if TOUCH %}
        M117 Touch homing
        # Hot wipe first. Ooze from a filament load or the last print is stiff at 150 C, so a
        # 150 C wipe only smears it and the touches land on it (2026-10-21: touches at +0.14 /
        # +0.23 / +0.70 mm, one failed touch homing). Heat and cool with the tip inside the
        # bristles so any ooze goes into the brush, not onto the bed.
        {% set ymax = printer.toolhead.axis_maximum.y %}
        {% set wipe_z = printer["gcode_macro NOZZLE_CLEAN"].wipe_z %}
        G90
        G1 Z{wipe_z + 6} F1500
        G1 X180 Y{ymax - 2} F6000        ; over the brush
        G1 Z{wipe_z} F600                ; tip in the bristles while it heats
        ; Range waits, not M109: M109 also waits for the reading to settle and can hang on thermistor jitter
        M104 S{EXTRUDER}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER - 5} MAXIMUM={EXTRUDER + 10}
        NOZZLE_CLEAN                     ; hot wipe: the ooze is soft now
        G1 Z{wipe_z + 6} F1500
        G1 X180 Y{ymax - 2} F6000
        G1 Z{wipe_z} F600                ; cool back down inside the bristles
        M104 S{TOUCH_TEMP}
        M106 S255                        ; part fan speeds the cool-down
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={TOUCH_TEMP - 5} MAXIMUM={TOUCH_TEMP + 1}
        M107
        NOZZLE_CLEAN                     ; final wipe at touch temperature
        ; Relieve nozzle pressure so the touches don't leave a dab of plastic to land on (SV08, 2026-10-04).
        ; PURGE_LINE's prime puts it back.
        M83
        G1 E-1 F1800
        CARTOGRAPHER_TOUCH_HOME          ; true Z0: nozzle touches the plate at 175,175
        _CHECK_TOUCH_HOME                ; abort if the touch landed on plastic stuck to the nozzle
    {% endif %}

    M117 Meshing
    BED_MESH_CALIBRATE ADAPTIVE=1        ; mesh only where the parts are (needs [exclude_object])

    M117 Heating nozzle
    M109 S{EXTRUDER}
    NOZZLE_CLEAN                         ; second wipe at print temp: clears ooze from heating up
    PURGE_LINE
    M117 Printing


[gcode_macro _CHECK_TOUCH_HOME]
description: Abort the print if touch homing landed on plastic or far from where the scan model put the bed
# last_z_result = height (in scan-homed coordinates) at which the nozzle touched.
#   Positive: touched ABOVE the scanned bed - plastic on the tip lifts Z0 by its thickness
#   (Eddy era: 1.87 mm on 2026-10-12, first layer printed in mid-air).
#   Negative: the coil is cooler than at calibration (no temperature compensation).
# Limits copied from the SV08's Cartographer (clean tip there: -0.065..+0.004); tune from the
# Voron's own clean-tip results. Separate macro so the status is read AFTER the touch.
variable_max_high: 0.07
variable_max_low: 0.2
gcode:
    {% set z = printer.cartographer.touch.last_z_result %}
    {% if z is none %}
        { action_raise_error("No touch result: CARTOGRAPHER_TOUCH_HOME did not run") }
    {% elif z|float > max_high or z|float < -max_low %}
        TURN_OFF_HEATERS
        G91
        G0 Z15 F600
        G90
        _TOUCH_ABORT Z={z}               ; raises in its own render, so the lines above run first
    {% else %}
        RESPOND MSG="Touch check OK: z={'%.3f' % z|float} (limits -{max_low}..+{max_high})"
    {% endif %}

[gcode_macro _TOUCH_ABORT]
description: Raise _CHECK_TOUCH_HOME's print-aborting error (action_raise_error fires at render time, before a macro's own commands)
gcode:
    {% set c = printer["gcode_macro _CHECK_TOUCH_HOME"] %}
    {% set z = params.Z|float %}
    {% if z > 0 %}
        { action_raise_error("Touch homing hit something %.3f mm above the bed (limit %.2f): plastic on the nozzle tip? Heat to 200, brush it clean, then restart the print." % (z, c.max_high)) }
    {% else %}
        { action_raise_error("Touch found the bed %.3f mm below where the scan model expected (limit %.2f). Recalibrate: CARTOGRAPHER_SCAN_CALIBRATE METHOD=touch (hot)." % (z, c.max_low)) }
    {% endif %}

[gcode_macro _RESET_RUNTIME]
description: Restore runtime state to printer.cfg values (Klipper keeps PA, M221, M220, G-code offset and limits between prints)
gcode:
    {% set cfg = printer.configfile.settings %}
    SET_GCODE_OFFSET Z=0                 ; Z0 comes from touch homing; a leftover babystep would shift it
    BED_MESH_CLEAR                       ; a cancelled print leaves its mesh loaded; with Z unhomed that makes G28's XY moves fail
    M220 S100
    M221 S100
    SET_PRESSURE_ADVANCE ADVANCE={cfg.extruder.pressure_advance} SMOOTH_TIME={cfg.extruder.pressure_advance_smooth_time}
    SET_VELOCITY_LIMIT VELOCITY={cfg.printer.max_velocity} ACCEL={cfg.printer.max_accel} SQUARE_CORNER_VELOCITY={cfg.printer.square_corner_velocity}
    {% if 'firmware_retraction' in cfg %}
        {% set r = cfg.firmware_retraction %}
        SET_RETRACTION RETRACT_LENGTH={r.retract_length} RETRACT_SPEED={r.retract_speed} UNRETRACT_EXTRA_LENGTH={r.unretract_extra_length} UNRETRACT_SPEED={r.unretract_speed}
    {% endif %}
    ; per-filament values (PA, retraction) come after PRINT_START from the slicer's filament start G-code

[gcode_macro NOZZLE_CLEAN]
description: Safe nozzle wipe using brush (requires homed axes)
# Brush mount replaced 2026-10-17: wipe at Z6 (was Z1; Z9 on first setup was too shallow),
# so anything that goes to the back row stays above wipe_z + 6 (see PRINT_END).
variable_wipe_z: 6
gcode:
    {% if "x" not in printer.toolhead.homed_axes
          or "y" not in printer.toolhead.homed_axes
          or "z" not in printer.toolhead.homed_axes %}
        {action_raise_error("NOZZLE_CLEAN aborted: Printer not homed")}
    {% endif %}

    SAVE_GCODE_STATE NAME=NOZZLE_CLEAN_STATE

    G90                         ; absolute positioning
    G1 Z20 F3000                ; lift slightly before travel (extra safety)
    G1 X100 Y{printer.toolhead.axis_maximum.y - 2} F6000   ; brush row; 2 mm short of the frame (Y350 = sensorless stop)
    G1 Z{wipe_z} F1500          ; drop to wipe height

    {% for i in range(3) %}
        G1 X200 F4000           ; brush end A
        G1 X160 F4000           ; brush end B
    {% endfor %}

    G1 Z{wipe_z + 6} F3000      ; lift clear of the bristles
    G1 Y{printer.toolhead.axis_maximum.y - 50} F6000   ; move off the brush: later moves (PURGE_LINE's Z3) may go low at the current XY
    RESTORE_GCODE_STATE NAME=NOZZLE_CLEAN_STATE




[gcode_macro PRINT_END]
description: End print routine
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_clear = printer["gcode_macro NOZZLE_CLEAN"].wipe_z + 6 %}   ; the park spot is over the brush
    {% set z_safe = [[th.position.z + 2, z_clear]|max, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400
    G92 E0
    G1 E-5.0 F1800
    TURN_OFF_HEATERS
    M107
    G90
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F6000
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0
    M117 Print Complete

# [gcode_macro PURGE_LINE]
# description: Reliable purge that guarantees flow and stops cleanly
# gcode:
#     M117 Purging...
#     G90
#     G92 E0
#     G1 Z5 F3000
#     G1 X150 Y10 F6000
#     G1 Z0.1 F600

#     # --- Prime sequence ---
#     G1 E6 F200            ; slow refill to clear any air pocket
#     G1 E4 F1200            ; build pressure quickly
#     G4 P300               ; short dwell for melt zone equalization

#     # --- Purge line ---
#     G1 X230 E12 F1000      ; slower + longer, guarantees visible line
#     G1 Y12 F800
#     G1 X150 E10 F800      ; second pass back

#     # --- Gentle pressure relief (smaller retract) ---
#     # G1 E-0.1 F600        ; just enough to stop ooze, not pull filament out

#     # --- Cleanup ---
#     G92 E0
#     G1 Z2 F2000
#     G1 X150 Y50 F6000
#     M117 Purge line done


[gcode_macro PURGE_LINE]
description: Optimized thick purge for 0.4mm nozzle + Dragon UHF
gcode:
    M117 Purging...
    G90                  ; Absolute coordinates for XY
    M83                  ; Relative Extrusion mode (Essential fix)
    G92 E0               ; Reset extruder

    ; --- Position for start ---
    G1 Z3.0 F3000        ; Lift Z
    G1 X150 Y28 F6000    ; Move to start position (Y min is 25)

    ; --- Lower to purge height ---
    ; Z0.4 gives the 0.4mm nozzle room to lay a thick bead without scraping
    G1 Z0.4 F600         

    ; --- Prime the Meltzone ---
    ; Dragon UHF tends to ooze, so we re-prime heavily before moving
    G1 E8 F500           ; Extrude anchor blob
    G4 P500              ; Wait for pressure equalization

    ; --- Purge Line ---
    ; E14 creates a ~1.0mm wide line (Very thick for a 0.4 nozzle)
    ; Speed F1500 keeps volumetric flow safe (~11mm3/s) to prevent skipping
    G1 X230 E14 F1500    
    G1 Y30 F1500         
    G1 X150 E14 F1500    

    ; --- Retract & Wipe ---
    G1 E-0.5 F3000       ; standard retraction
    G1 Z2.0 F3000        ; Lift Z
    G1 X140 Y28 F12000   ; Wipe away
    
    G92 E0               ; Reset E
    M117 Purge line done

[gcode_macro PARK_FRONT]
description: Move printhead to front for easy inspection.
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    G90
    G0 X175 Y30 Z100 F9000


[gcode_macro M205]
description: Ignore Marlin M205 command (not used in Klipper)
gcode:
    # Silently ignore all parameters
    {% for key, value in params.items() %}
      # ignoring M205 parameter {{key}}={{value}}
    {% endfor %}
