#####################################################################
#   TOOLHEAD: Xol (AHI) + BTT EBB36 v1.2 (CAN) + Orbiter V2 + Dragon UHF + XolPAP (CPAP)
#####################################################################
# DRAFT - NOT INCLUDED YET. Pins are from Klipper's config/sample-bigtreetech-ebb-canbus-v1.2.cfg
# and BTT's EBB36 v1.1/v1.2 pin diagram. Every "TODO" must be checked against the hardware first.
#
# Kept HERE, not in printer.cfg's SAVE_CONFIG block, so they survive a toolhead swap:
#   hotend PID, input shaper, max_accel, probe offsets, Cartographer model names (_TOOLHEAD).
#   Klipper refuses SAVE_CONFIG for a value that is also set here, so after PID_CALIBRATE or
#   SHAPER_CALIBRATE copy the results into this file instead. Cartographer models are saved
#   with SAVE_CONFIG under this toolhead's names (xol, xol_asa, xol_pla).
#
# FIRST INSTALL:
#   1. Flash the EBB36 (Katapult + Klipper, CAN 1 Mbit/s, see firmware/ebb36-v1.2/), UUID below.
#   2. CAN: 120R jumper ON on the EBB36; Cartographer pads stay unbridged. The EBB36 has one CAN
#      plug (GND, VIN, CAN-L, CAN-H) and no probe port, so the Cartographer harness is:
#        - 5V + GND from the EBB36 RGB plug (+5V, PD3, GND; leave PD3 unconnected). 5 V only.
#        - CAN-H / CAN-L spliced into the CAN cable a few cm before the EBB36 (keep the stub short).
#        - Cartographer order: Red 5V, Black GND, Yellow CAN-H, White CAN-L.
#   3. Commissioning: hotend PID (copy here), extruder direction + rotation_distance, fans,
#      AXES_MAP_CALIBRATION, Cartographer: CARTOGRAPHER_SCAN_CALIBRATE MODEL=xol_asa (paper test,
#      bed 100 / nozzle 150) + CARTOGRAPHER_TOUCH_CALIBRATE MODEL=xol + SAVE_CONFIG. Shaper and PA
#      come in the tuning pass (vault: Voron 2.4 - Upgrade Plan).
#
# AFTER SWAPPING BACK TO THIS TOOLHEAD (once it has been tuned):
#   1. printer.cfg: [include toolhead-xol.cfg], then FIRMWARE_RESTART; all MCUs connect.
#   2. The Cartographer moved mounts: paper test (MODEL=xol_asa), touch calibrate (MODEL=xol),
#      SAVE_CONFIG, touch check, one first-layer patch. PID, shaper and extruder values carry over.

[gcode_macro _TOOLHEAD]
description: This toolhead's name and Cartographer models (loaded at startup and by PRINT_START)
variable_name: 'xol'
variable_touch: 'xol'           # touch model
variable_scan_asa: 'xol_asa'    # scan model for bed >= 90 (ASA/ABS)
variable_scan_pla: 'xol_pla'    # scan model for bed < 90 (PLA)
gcode:
    RESPOND MSG="Toolhead: {printer['gcode_macro _TOOLHEAD'].name}"

[printer]
max_accel: 3000                  # TODO: unshaped until SHAPER_CALIBRATE; raise with the shaper result

[input_shaper]
# TODO: empty = no shaping. After SHAPER_CALIBRATE, put shaper_type_x/freq_x/type_y/freq_y here.

[mcu EBBCan]
canbus_uuid: TODO_EBB36_UUID     # ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0
canbus_interface: can0

[temperature_sensor EBB_MCU]
sensor_type: temperature_mcu
sensor_mcu: EBBCan

#####################################################################
#   Extruder (Orbiter V2) + hotend (Dragon UHF)
#####################################################################

[extruder]
step_pin: EBBCan:PD0
dir_pin: !EBBCan:PD1             # TODO: check direction with a short extrude
enable_pin: !EBBCan:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637         # TODO: Orbiter V2 nominal; calibrate with a 100 mm extrude
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan:PB13
sensor_type: EPCOS 100K B57560G104F   # the Dragon UHF's own 100K NTC (git a04f526^, used until 2026-01-19)
sensor_pin: EBBCan:PA3           # TH0. NTC: leave the "PT1000" jumper next to TH0 OFF (default pull-up)
control: pid                     # Dragon UHF on the SB2209 before 2026-01; starting point, re-run PID_CALIBRATE
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 300                    # 100K NTC: not above 300 (the old config's 350 was too high)
max_extrude_only_distance: 150
min_extrude_temp: 140            # PRINT_START retracts 1 mm at the 150 C touch temp
pressure_advance: 0.03           # TODO: placeholder; tune per filament (direct drive Orbiter usually low)

[tmc2209 extruder]
uart_pin: EBBCan:PA15
run_current: 0.85                # TODO: check the Orbiter V2 motor's recommended current
hold_current: 0.10
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: True

#####################################################################
#   Fans
#####################################################################

# Part fan: the CPAP through the XolPAP duct, [fan] in cpap.cfg (shared with the Stealthburner).

[heater_fan hotend_fan]
pin: EBBCan:PA1
heater: extruder
heater_temp: 50.0
# tachometer_pin: ...            # TODO: a 3-wire hotend fan + tach catches a dead fan (SV08 heat-creep clog)

#####################################################################
#   Accelerometer (on the EBB36)
#####################################################################

[adxl345]
cs_pin: EBBCan:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z                  # TODO: AXES_MAP_CALIBRATION once mounted

[resonance_tester]
probe_points: 175, 175, 20
accel_chip: adxl345

#####################################################################
#   Probe position (Xol probe module for Beacon/Cartographer, UHF length)
#####################################################################

[cartographer]
x_offset: 0                      # TODO: measure for the Xol probe module
y_offset: 0                      # TODO: measure for the Xol probe module
