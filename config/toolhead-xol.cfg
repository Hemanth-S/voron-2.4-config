#####################################################################
#   TOOLHEAD: Xol (AHI) + BTT EBB36 v1.2 (CAN) + Orbiter V2 + Dragon UHF + XolPAP (CPAP)
#####################################################################
# DRAFT - NOT INCLUDED YET. Pins are from Klipper's config/sample-bigtreetech-ebb-canbus-v1.2.cfg.
# Every "TODO" must be checked against the real hardware before this file is used.
#
# To switch (see toolhead-stealthburner.cfg for the full recalibration list):
#   1. printer.cfg: [include toolhead-stealthburner.cfg]  ->  [include toolhead-xol.cfg]
#   2. printer.cfg: remove [include cpap.cfg] (this file defines the CPAP as the part [fan])
#   3. Flash the EBB36 (Katapult + Klipper, CAN 1 Mbit/s) and put its UUID below
#   4. CAN: 120R jumper ON on the EBB36; Cartographer pads stay unbridged; the Cartographer needs
#      a CAN branch at the toolhead (the EBB36 has no SB0000-style 4-pin probe port)
#   5. PID, input shaper, Cartographer calibration, rotation_distance, PA (see the other file)

[mcu EBBCan]
canbus_uuid: TODO_EBB36_UUID     # ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0
canbus_interface: can0

[temperature_sensor EBB_MCU]
sensor_type: temperature_mcu
sensor_mcu: EBBCan

#####################################################################
#   Extruder (Orbiter V2) + hotend (Dragon UHF)
#####################################################################

[extruder]
step_pin: EBBCan:PD0
dir_pin: !EBBCan:PD1             # TODO: check direction with a short extrude
enable_pin: !EBBCan:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637         # TODO: Orbiter V2 nominal; calibrate with a 100 mm extrude
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan:PB13
sensor_type: PT1000              # TODO: confirm the Dragon UHF's thermistor (PT1000 vs EPCOS 100K B57560G104F).
sensor_pin: EBBCan:PA3           #   PT1000 directly on PA3 needs the EBB36's PT1000 pull-up jumper - check the BTT wiki;
                                 #   or use the MAX31865 channel (EBBCan:PA4, spi1) for better accuracy
min_temp: 0
max_temp: 300                    # TODO: set to the hotend/thermistor rating
max_extrude_only_distance: 150
min_extrude_temp: 140            # PRINT_START retracts 1 mm at the 150 C touch temp
pressure_advance: 0.03           # TODO: placeholder; tune per filament (direct drive Orbiter usually low)

[tmc2209 extruder]
uart_pin: EBBCan:PA15
run_current: 0.85                # TODO: check the Orbiter V2 motor's recommended current
hold_current: 0.10
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: True

#####################################################################
#   Fans
#####################################################################

# Part cooling = XolPAP CPAP blower on the Octopus (WS2403DY01V04 driver VSR on PG15),
# replaces [fan_generic cpap] from cpap.cfg.
[fan]
pin: PG15
cycle_time: 0.005                # 200 Hz software PWM (Mellow example)
hardware_pwm: False
shutdown_speed: 0
# tachometer_pin: ^PG11          # TODO: driver FG (white) once its voltage is checked (<= 3.3 V)

[heater_fan hotend_fan]
pin: EBBCan:PA1
heater: extruder
heater_temp: 50.0
# tachometer_pin: ...            # TODO: a 3-wire hotend fan + tach catches a dead fan (SV08 heat-creep clog)

#####################################################################
#   Accelerometer (on the EBB36)
#####################################################################

[adxl345]
cs_pin: EBBCan:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z                  # TODO: AXES_MAP_CALIBRATION once mounted

[resonance_tester]
probe_points: 175, 175, 20
accel_chip: adxl345

#####################################################################
#   Probe position (Xol probe module for Beacon/Cartographer, UHF length)
#####################################################################

[cartographer]
x_offset: 0                      # TODO: measure for the Xol probe module
y_offset: 0                      # TODO: measure for the Xol probe module
