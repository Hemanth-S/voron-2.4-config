#####################################################################
#   TOOLHEAD: Xol (AHI) + LDO Nitehawk-36 (USB) + Orbiter V2 + Dragon UHF + XolPAP (CPAP)
#####################################################################
# DRAFT - NOT INCLUDED YET. Chosen 2026-10-31 over the EBB36 (toolhead-xol-ebb36.cfg, spare):
# the Nitehawk-36 has an onboard USB hub, so the Cartographer plugs straight into it (like the SV08).
# Pins: the SV08's Nitehawk-36 config (~/sv08/extruder.cfg), verified end to end there against
# LDO's pin table (https://docs.ldomotors.com/en/Toolboard/nitehawk-36). TODOs need the hardware.
#
# Wiring
#   Nitehawk cable -> LDO adapter PCB in the electronics bay (24 V from the PSU, USB to the Pi).
#   Heater: gpio9. Thermistor: TH0 = gpio29, the Nitehawk's 2.2 kOhm pull-up; PT1000 jumper in the
#   same (NTC) position as on the SV08's Nitehawk. Extruder: the onboard TMC2209. Hotend fan:
#   HEF = gpio5 (2-wire). Cartographer: hub port 1 with the Nitehawk kit's probe cable.
#   Part fan: the CPAP on the Octopus, [fan] in cpap.cfg (shared with the Stealthburner).
#   No CAN on this toolhead: the Stealthburner's CAN cable stays in the routing, unplugged.
# Power order (SV08 lesson): 24 V up before or with the Pi. If the Pi wins, the hub enumerates
# without the Nitehawk -> FIRMWARE_RESTART. The firmware also carries the 64 ms crystal start-up
# patch (firmware/nitehawk-36/), or the RP2040 may not start on a cold power-up.
#
# Kept HERE, not in printer.cfg's SAVE_CONFIG block, so they survive a toolhead swap:
#   hotend PID, input shaper, max_accel, probe connection + offsets, Cartographer model names.
#   Klipper refuses SAVE_CONFIG for a value that is also set here, so after PID_CALIBRATE or
#   SHAPER_CALIBRATE copy the results into this file instead. Cartographer models are saved
#   with SAVE_CONFIG under this toolhead's names (xol, xol_asa, xol_pla).
#
# FIRST INSTALL
#   1. Flash the Nitehawk (firmware/nitehawk-36/README.md), put its serial path below.
#   2. Probe firmware CAN -> USB while it is still on the Stealthburner (Cartographer's
#      katapult_deployer_v4_USB.bin over CAN, then the 6.2.0 USB app), put its serial path below.
#   3. printer.cfg: [include toolhead-xol.cfg], FIRMWARE_RESTART.
#   4. Commissioning: hotend PID (copy here), extruder direction + 100 mm rotation_distance,
#      fans, AXES_MAP_CALIBRATION, Cartographer: CARTOGRAPHER_SCAN_CALIBRATE MODEL=xol_asa (paper
#      test, bed 100 / nozzle 150) + CARTOGRAPHER_TOUCH_CALIBRATE MODEL=xol + SAVE_CONFIG.
#      Shaper and PA come in the tuning pass (vault: Voron 2.4 - Upgrade Plan).
# AFTER SWAPPING BACK TO THIS TOOLHEAD (once tuned)
#   1. printer.cfg: [include toolhead-xol.cfg]; plug the Nitehawk cable; probe to the Xol mount.
#   2. Probe firmware CAN -> USB (as in first install, step 2), probe into hub port 1, FIRMWARE_RESTART.
#   3. Paper test (MODEL=xol_asa), touch calibrate (MODEL=xol), SAVE_CONFIG, touch check, one
#      first-layer patch. PID, shaper and extruder values carry over.

[gcode_macro _TOOLHEAD]
description: This toolhead's name and Cartographer models (loaded at startup and by PRINT_START)
variable_name: 'xol'
variable_touch: 'xol'           # touch model
variable_scan_asa: 'xol_asa'    # scan model for bed >= 90 (ASA/ABS)
variable_scan_pla: 'xol_pla'    # scan model for bed < 90 (PLA)
gcode:
    RESPOND MSG="Toolhead: {printer['gcode_macro _TOOLHEAD'].name}"

[printer]
max_accel: 3000                  # TODO: unshaped until SHAPER_CALIBRATE; raise with the shaper result

[input_shaper]
# TODO: empty = no shaping. After SHAPER_CALIBRATE, put shaper_type_x/freq_x/type_y/freq_y here.

[mcu nitehawk]
serial: /dev/serial/by-id/usb-Klipper_rp2040_TODO-if00        # ls /dev/serial/by-id/ after flashing

[mcu cartographer]               # probe on USB (USB firmware) through the Nitehawk's hub
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_TODO-if00
restart_method: command

[temperature_sensor nitehawk]
sensor_type: temperature_mcu
sensor_mcu: nitehawk

#####################################################################
#   Extruder (Orbiter V2) + hotend (Dragon UHF)
#####################################################################

[extruder]
step_pin: nitehawk:gpio23
dir_pin: !nitehawk:gpio24        # TODO: check direction with a short extrude (SV08's value)
enable_pin: !nitehawk:gpio25
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637         # TODO: Orbiter V2 nominal; calibrate with a 100 mm extrude
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nitehawk:gpio9
sensor_type: EPCOS 100K B57560G104F   # the Dragon UHF's own 100K NTC (git a04f526^, used until 2026-01-19)
sensor_pin: nitehawk:gpio29
pullup_resistor: 2200            # Nitehawk-36 thermistor pull-up (SV08: verified)
control: pid                     # Dragon UHF on the SB2209 before 2026-01; starting point, re-run PID_CALIBRATE
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 300                    # 100K NTC: not above 300 (the old config's 350 was too high)
max_extrude_only_distance: 150
min_extrude_temp: 140            # PRINT_START retracts 1 mm at the 150 C touch temp
pressure_advance: 0.03           # TODO: placeholder; tune per filament in the tuning pass

[tmc2209 extruder]
uart_pin: nitehawk:gpio0
tx_pin: nitehawk:gpio1
sense_resistor: 0.100            # the Nitehawk-36's value (Klipper's 0.110 default would be ~10% off)
run_current: 0.65                # TODO: check the Orbiter V2 motor's rating (SV08's LDO motor: 0.55-0.7)
stealthchop_threshold: 0
interpolate: True

#####################################################################
#   Fans
#####################################################################
# Part fan: the CPAP through the XolPAP duct, [fan] in cpap.cfg (shared with the Stealthburner).

[heater_fan hotend_fan]
pin: nitehawk:gpio5              # HEF port; add tachometer_pin: nitehawk:gpio16 for a 3-wire fan
heater: extruder
heater_temp: 50.0

#####################################################################
#   Accelerometer: the Cartographer's own (the Nitehawk-36 has none), as on the SV08
#####################################################################

[adxl345]
cs_pin: cartographer:PA0
spi_bus: spi1
axes_map: x,y,z                  # TODO: AXES_MAP_CALIBRATION once mounted

[resonance_tester]
probe_points: 175, 175, 20
accel_chip: adxl345

#####################################################################
#   Probe position (Xol probe module for Beacon/Cartographer, UHF length)
#####################################################################

[cartographer]
x_offset: 0                      # TODO: measure for the Xol probe module
y_offset: 0                      # TODO: measure for the Xol probe module
