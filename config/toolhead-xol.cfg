#####################################################################
#   TOOLHEAD: Xol (AHI) + LDO Nitehawk-36 (USB) + Orbiter V2 + Dragon UHF + XolPAP (CPAP)
#####################################################################
# DRAFT - NOT INCLUDED YET. Chosen 2026-10-31 over the EBB36 (toolhead-xol-ebb36.cfg, spare):
# the Nitehawk-36 has an onboard USB hub, so the Cartographer plugs straight into it (like the SV08).
# Pins: the SV08's Nitehawk-36 config (~/sv08/extruder.cfg), verified end to end there against
# LDO's pin table (https://docs.ldomotors.com/en/Toolboard/nitehawk-36). TODOs need the hardware.
#
# Wiring
#   Nitehawk cable -> LDO adapter PCB in the electronics bay (24 V from the PSU, USB to the Pi).
#   Heater: screw terminal, gpio9. Thermistor: 2-pin JST-PH, gpio29, fixed 2.2 kOhm pull-up (LDO's
#   pinout shows no PT1000 jumper). Extruder: the onboard TMC2209 (JST-XH 4P). Hotend fan: HEF =
#   3-pin JST-PH (+ / TACH gpio16 / - gpio5): a 2-wire fan uses the outer pins, HEF voltage jumper
#   on 24V. Cartographer: USB expansion port (JST-ZH 5P) with the Nitehawk kit's probe cable.
#   (LDO pinout: github.com/MotorDynamicsLab/Nitehawk-36/blob/master/Images/nh36_pcb_pinout.jpg)
#   Part fan: the CPAP on the Octopus, [fan] in cpap.cfg (shared with the Stealthburner).
#   No CAN on this toolhead: the Stealthburner's CAN cable stays in the routing, unplugged.
# Power order (SV08 lesson): 24 V up before or with the Pi. If the Pi wins, the hub enumerates
# without the Nitehawk -> FIRMWARE_RESTART. The firmware also carries the 64 ms crystal start-up
# patch (firmware/nitehawk-36/), or the RP2040 may not start on a cold power-up.
#
# Kept HERE, not in printer.cfg's SAVE_CONFIG block, so they survive a toolhead swap:
#   hotend PID, input shaper, max_accel, probe connection + offsets, Cartographer model names.
#   Klipper refuses SAVE_CONFIG for a value that is also set here, so after PID_CALIBRATE or
#   SHAPER_CALIBRATE copy the results into this file instead. Cartographer models are saved
#   with SAVE_CONFIG under this toolhead's names (xol, xol_asa, xol_pla).
#
# FIRST INSTALL
#   1. [done 2026-10-31] Flash the Nitehawk (firmware/nitehawk-36/README.md), serial path below.
#   2. [done 2026-10-31, DFU] Probe firmware CAN -> USB. DFU entry: tweezers into the BT0 + 3V3
#      holes (box "1"), then plug the USB cable into the RUNNING Pi, hold 3 s (bridging while the
#      printer powers up didn't work). Then sudo dfu-util -a 0 -d 0483:df11 --dfuse-address
#      0x08000000:force:mass-erase -D ~/cartographer_firmware/firmware/v4/katapult/Katapult_V4_USB.bin
#      and --dfuse-address 0x08002000:leave -D .../v4/firmware/6.2.0/CartographerV4_6.2.0_USB_full_8kib_offset.bin
#      ("Error during download get_status" after the leave request is normal).
#      No-DFU route: the USB deployer over CAN (Cartographer docs: firmware/switching-protocols).
#   3. [done 2026-10-31] printer.cfg: [include toolhead-xol.cfg], FIRMWARE_RESTART.
#   4. Commissioning: hotend PID (copy here), extruder direction + 100 mm rotation_distance,
#      fans, AXES_MAP_CALIBRATION, Cartographer, shaper.
#      Cartographer [done 2026-11-05, touch only, no paper test]: G28 X Y, nozzle 150, bed cold:
#      CARTOGRAPHER_TOUCH_CALIBRATE MODEL=xol (threshold 1045) -> CARTOGRAPHER_TOUCH_HOME -> bed 100,
#      park Z3 over the centre, soak -> QUAD_GANTRY_LEVEL -> CARTOGRAPHER_SCAN_CALIBRATE
#      MODEL=xol_asa METHOD=touch -> G28 Z + CARTOGRAPHER_TOUCH_HOME + _CHECK_TOUCH_HOME (got
#      +0.002 / +0.002 / -0.008) -> SAVE_CONFIG.
#      QGL BEFORE the scan model: built on a gantry 2.6 mm out of level, it read 0.097 high once
#      level (the tilt moves the coil, 21 mm behind the nozzle, relative to the tip).
# AFTER SWAPPING BACK TO THIS TOOLHEAD (once tuned)
#   1. printer.cfg: [include toolhead-xol.cfg]; plug the Nitehawk cable; probe to the Xol mount.
#   2. Probe firmware CAN -> USB (as in first install, step 2), probe into hub port 1, FIRMWARE_RESTART.
#   3. Cartographer as in first install step 4 (touch only, QGL before the scan model), one
#      first-layer patch. PID, shaper and extruder values carry over.

[gcode_macro _TOOLHEAD]
description: This toolhead's name and Cartographer models (loaded at startup and by PRINT_START)
variable_name: 'xol'
variable_touch: 'xol'           # touch model
variable_scan_asa: 'xol_asa'    # scan model for bed >= 90 (ASA/ABS)
variable_scan_pla: 'xol_pla'    # scan model for bed < 90 (PLA)
gcode:
    RESPOND MSG="Toolhead: {printer['gcode_macro _TOOLHEAD'].name}"

[printer]
# Shaper smoothing allows up to 7000 (Y). 5000 = the highest that passed the lost-step test on the
# heavier Stealthburner (2026-10-21); re-run that test on the Xol before going higher.
max_accel: 5000

[input_shaper]
# SHAPER_CALIBRATE 2026-11-05 (2WD, axes_map y,-x,z; data in data/shaper/2026-11-05-xol/).
# Stealthburner was X mzv 52.0 / Y mzv 38.0: the lighter Xol lifts Y the most.
shaper_type_x: mzv
shaper_freq_x: 56.0              # max_accel <= 9200
shaper_type_y: mzv
shaper_freq_y: 48.8              # max_accel <= 7000

[mcu nitehawk]
serial: /dev/serial/by-id/usb-Klipper_rp2040_3434343339138651-if00   # flashed 2026-10-31 (v0.13.0-464)

[mcu cartographer]               # probe on USB (USB firmware) through the Nitehawk's hub
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_38006A000850525537333120-if00   # USB 6.2.0 via DFU 2026-10-31
restart_method: command

[temperature_sensor nitehawk]
sensor_type: temperature_mcu
sensor_mcu: nitehawk

#####################################################################
#   Extruder (Orbiter V2) + hotend (Dragon UHF)
#####################################################################

[extruder]
step_pin: nitehawk:gpio23
dir_pin: !nitehawk:gpio24        # TODO: check direction with a short extrude (SV08's value)
enable_pin: !nitehawk:gpio25
microsteps: 16
full_steps_per_rotation: 200
# The SV08's Orbiter V2 value (ruler test 2026-09-06: 4.637 nominal * 95/100). TODO: confirm on this
# extruder with a 100 mm extrude (mark 120 mm above the inlet, measure what's left).
rotation_distance: 4.405
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nitehawk:gpio9
sensor_type: EPCOS 100K B57560G104F   # the Dragon UHF's own 100K NTC (git a04f526^, used until 2026-01-19)
sensor_pin: nitehawk:gpio29
pullup_resistor: 2200            # Nitehawk-36 thermistor pull-up (SV08: verified)
control: pid                     # PID_CALIBRATE 245 C, CPAP off, 2026-11-01 (was 21.527/1.063/108.982 on the SB2209)
pid_Kp: 16.492
pid_Ki: 0.598
pid_Kd: 113.802
min_temp: 0
max_temp: 300                    # 100K NTC: not above 300 (the old config's 350 was too high)
max_extrude_only_distance: 150
min_extrude_temp: 140            # PRINT_START retracts 1 mm at the 150 C touch temp
pressure_advance: 0.03           # TODO: placeholder; tune per filament in the tuning pass

[tmc2209 extruder]
uart_pin: nitehawk:gpio0
tx_pin: nitehawk:gpio1
sense_resistor: 0.100            # the Nitehawk-36's value (Klipper's 0.110 default would be ~10% off)
run_current: 0.65                # TODO: check the Orbiter V2 motor's rating (SV08's LDO motor: 0.55-0.7)
stealthchop_threshold: 0
interpolate: True

#####################################################################
#   Fans
#####################################################################
# Part fan: the CPAP through the XolPAP duct, [fan] in cpap.cfg (shared with the Stealthburner).

[heater_fan hotend_fan]
pin: nitehawk:gpio5              # HEF port; add tachometer_pin: nitehawk:gpio16 for a 3-wire fan
heater: extruder
heater_temp: 50.0

#####################################################################
#   Accelerometer: the Cartographer's own (the Nitehawk-36 has none), as on the SV08
#####################################################################

[adxl345]
cs_pin: cartographer:PA0
spi_bus: spi1
# Measured 2026-11-05 (stock Klipper has no AXES_MAP_CALIBRATION; that's Shake&Tune): recorded
# 50 mm moves at 3000 mm/s^2. +X showed on chip +y (+2603 / -2551), +Y on chip -x (-3428),
# gravity on chip +z (+9883). Re-measure if the probe or its mount is turned.
axes_map: y, -x, z

[resonance_tester]
probe_points: 175, 175, 20
accel_chip: adxl345

#####################################################################
#   Probe position: Cartographer CNC Stealthburner mount on printed spacers
#####################################################################
# The mount is made for the Stealthburner; the Xol's nozzle sits higher, so spacers bring the coil
# to 2.6-3.0 mm above the tip (fitted 2026-11-05). Coil directly behind the nozzle.

[cartographer]
x_offset: 0                      # coil centred on the nozzle (checked 2026-11-05)
y_offset: 21.1                   # ruler: ~21 behind the nozzle (2026-11-05), so the old value stays
