#####################################################################
#   SENSORLESS XY HOMING (TMC2209 StallGuard) - 2026-10-16
#####################################################################
# Hardware: Octopus Pro DIAG jumpers fitted on MOTOR0 (stepper_x -> PG6) and
# MOTOR1 (stepper_y -> PG9); the X and Y endstop switches are unplugged (they share
# those pins) and the Y-switch hot-glue shim is removed.
# X homes to the right (+X), Y to the back (+Y), into the frame at reduced current.
# Z still homes with the Eddy at the bed centre (replaces [safe_z_home], which
# can't coexist with [homing_override]).
# Tuning: driver_SGTHRS in printer.cfg ([tmc2209 stepper_x/y]); higher = more sensitive.

# SET_KINEMATIC_POSITION (used for the Z hop before XY homing) only exists with this enabled
[force_move]
enable_force_move: True

[gcode_macro _SENSORLESS]
description: Shared settings for the sensorless homing macros
variable_home_current: 0.7     # A, X and Y motors while homing (run_current 0.8); 0.5 gave a narrower window
variable_retract: 10           # mm to back off after the bump
gcode:

[gcode_macro _HOME_X]
description: Sensorless home X at reduced current, then back off
gcode:
    {% set s = printer["gcode_macro _SENSORLESS"] %}
    {% set cx = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set cy = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={s.home_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={s.home_current}
    G4 P500                      ; let the current settle
    G28 X
    G91
    G0 X-{s.retract} F1200
    G90
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cx}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cy}
    G4 P1000                     ; StallGuard needs a moment before the next homing move

[gcode_macro _HOME_Y]
description: Sensorless home Y at reduced current, then back off
gcode:
    {% set s = printer["gcode_macro _SENSORLESS"] %}
    {% set cx = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set cy = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={s.home_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={s.home_current}
    G4 P500
    G28 Y
    G91
    G0 Y-{s.retract} F1200
    G90
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cx}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cy}
    G4 P1000

[homing_override]
axes: xyz
gcode:
    {% set th = printer.toolhead %}
    {% set want_x = 'X' in params %}
    {% set want_y = 'Y' in params %}
    {% set want_z = 'Z' in params %}
    {% if not (want_x or want_y or want_z) %}
        {% set want_x, want_y, want_z = True, True, True %}
    {% endif %}
    G90
    # Z hop before any XY move (what [safe_z_home] z_hop: 10 did)
    {% if 'z' not in th.homed_axes %}
        SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
        G0 Z10 F1500
        SET_KINEMATIC_POSITION SET_HOMED=Z CLEAR_HOMED=Z   ; SET_HOMED=Z needed: the default (xyz) would mark X/Y homed
    {% elif th.position.z < 10 %}
        G0 Z10 F1500
    {% endif %}
    {% if want_x or (want_z and 'x' not in th.homed_axes) %}
        _HOME_X
    {% endif %}
    {% if want_y or (want_z and 'y' not in th.homed_axes) %}
        _HOME_Y
    {% endif %}
    {% if want_z %}
        G0 X175 Y175 F6000           ; bed centre (was safe_z_home home_xy_position)
        G28 Z
        G0 Z10 F1500
    {% endif %}
