#####################################################################
#   CARTOGRAPHER V4 (CAN) - 2026-10-17, replaces the BTT Eddy Duo / eddy-ng
#####################################################################
# Plugin: cartographer3d-plugin 1.9.0 (pip, ~/klippy-env; moonraker [update_manager cartographer_plugin])
# Firmware: CartographerV4 6.2.0 CAN 1M (Katapult, 8 KiB offset), flashed over CAN 2026-10-17
# Wiring: SB0000 4-pin port. Red 5V, Black GND, Yellow CAN-H, White CAN-L. 5 V ONLY.
# Termination: the probe's own 120R pads are NOT bridged (and must stay that way);
# the EBB's 120R jumper + the Octopus terminate the bus.
# Mount: coil 2.6-3.0 mm above the nozzle tip.
# Z0 comes from touch (CARTOGRAPHER_TOUCH_HOME in PRINT_START), not the scan model.
# Docs: https://docs.cartographer3d.com/cartographer-probe/installation-and-setup/software-configuration/klipper-setup

[mcu cartographer]
canbus_uuid: 8c897c5dfef1
canbus_interface: can0

[cartographer]
mcu: cartographer
# PLACEHOLDER: standard Stealthburner mount (coil centre behind the nozzle). Measure once the
# mount is fitted and update these, the [bed_mesh] limits and the [quad_gantry_level] points.
x_offset: 0
y_offset: 21.1
verbose: no

[cartographer touch]
# Default agreement window 0.010 mm (plugin max 0.015). The SV08 needed 0.015 after a
# hotend rebuild loosened its toolhead; only widen this if homing keeps narrowly missing.
sample_range: 0.010

[bed_mesh]
zero_reference_position: 175, 175   # bed centre; also where CARTOGRAPHER_TOUCH_HOME touches
speed: 200                          # SV08 scans at 300 over USB; start gentler on the shared CAN bus
horizontal_move_z: 3
# mesh_min/max are PROBE coordinates. Probe = nozzle + (0, 21.1); nozzle travel X0-350 Y0-350 (2026-10-17).
# ~20 mm in from the PEI edges (eddy readings fall off near an edge). Back row: the probe board
# reaches ~12 mm behind the coil and scans ~6 mm above the bed, so stay well in front of the
# brush (Y~348, X~150-210, bristles up to Z9). Estimate - widen once the brush is measured.
mesh_min: 20, 25
mesh_max: 330, 310
probe_count: 20, 20
algorithm: bicubic
adaptive_margin: 5                  # extra mm around the parts for BED_MESH_CALIBRATE ADAPTIVE=1
mesh_pps: 0, 0

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

# The probe's onboard ADXL345 (V4: cs_pin cartographer:PA0) is left off: the EBB's ADXL
# (ebb-sb-can.cfg) already owns the [adxl345] / [resonance_tester] sections.
# [adxl345 cartographer]
# cs_pin: cartographer:PA0
# spi_bus: spi1

# Scan models (stored in printer.cfg's SAVE_CONFIG block): 'asa' only since 2026-10-21.
# The PLA 'default' model was deleted after the probe was re-seated (it was ~0.7 mm off).
# PRINT_START refuses BED < 90 until 'default' is recalibrated (bed 55, nozzle 150, home + QGL,
# CARTOGRAPHER_SCAN_CALIBRATE MODEL=default METHOD=touch, SAVE_CONFIG).
# The plugin auto-loads only a model named 'default' at startup, so load 'asa' when none is
# loaded; otherwise a manual G28 would have no scan model.
[delayed_gcode _LOAD_SCAN_MODEL]
initial_duration: 1
gcode:
    {% if printer.cartographer.scan.current_model in ('none', '') %}
        CARTOGRAPHER_SCAN_MODEL LOAD=asa
    {% endif %}
