#####################################################################
#   MCU DEFINITIONS
#####################################################################

[mcu]
canbus_uuid: 8aad5b6575b6

[include mainsail.cfg]

[include macros.cfg]

# TOOLHEAD: the only line to change when swapping toolheads, then FIRMWARE_RESTART.
#   toolhead-stealthburner.cfg  |  toolhead-xol.cfg
# Each file holds that toolhead's board, extruder, hotend PID, input shaper, max_accel, probe
# offsets and Cartographer model names; its header has the after-swap checklist.
[include toolhead-stealthburner.cfg]

# [include eddy-ng.cfg]   # BTT Eddy Duo, removed 2026-10-17
[include cartographer.cfg]
[include sensorless.cfg]
[include sfs.cfg]            # BTT SFS V2.0: runout PG12, motion PG13 (enabled 2026-10-19)
[include cpap.cfg]           # CPAP = part fan [fan] on PG15, both toolheads


#####################################################################
#   PRINTER KINEMATICS / LIMITS
#####################################################################


[printer]
kinematics: corexy
max_velocity: 400   # 500 tested clean on all corners @ accel 3000 (2026-10-04)
# max_accel: set in the toolhead file (it follows that toolhead's input shaper)
max_z_velocity: 20
max_z_accel: 1550
square_corner_velocity: 5.0

# Object labels for adaptive bed mesh + per-object cancel
# (slicer: Label objects = Firmware-specific; Moonraker object processing is the fallback)
[exclude_object]

#####################################################################
#   INPUT SHAPER
#####################################################################

[input_shaper]
#shaper_freq_x: 54.6
#shaper_type_x: mzv
#shaper_freq_y: 40.8
#shaper_type_y: zv
#shaper_freq_y: 47.4
#shaper_type_y: mzv


#####################################################################
#   Extruder
#####################################################################

# [extruder] and [tmc2209 extruder] live in the toolhead file (toolhead-stealthburner.cfg).

# Firmware retraction (G10/G11): lets TUNING_TOWER sweep retraction in one print and lets each
# filament set its own value with SET_RETRACTION in the slicer's filament start G-code.
# PLA pillar test (TUNING_TOWER 0-1.0 mm, 2026-10-12): strings stop at 0.1 -> 0.3 (2 steps margin).
# Per-filament values go in the slicer's filament start G-code (SET_RETRACTION).
[firmware_retraction]
retract_length: 0.3
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 25

#####################################################################
#   X / Y STEPPERS
#####################################################################

[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop   # sensorless (DIAG jumper MOTOR0 -> PG6); was switch on PG6
position_min: 0    # 2026-10-17: X0 Y0 clear by jogging once the side-mounted Eddy was gone (was 30: the Eddy bumped the front-left)
position_endstop: 350
position_max: 350
homing_speed: 40           # sensorless; 20 gave a narrow StallGuard window (false stops at start)
homing_retract_dist: 0     # sensorless: no second bump (macros back off instead)
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
diag_pin: ^PG6             # StallGuard output (DIAG jumper fitted)
driver_SGTHRS: 80          # sensorless (higher = more sensitive). @40 mm/s, 0.7 A: 60-100 stop cleanly at the frame, >=120 false-stops at the start (2026-10-16)
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop   # sensorless (DIAG jumper MOTOR1 -> PG9); was switch on PG9
position_min: 0    # 2026-10-17, see stepper_x (was 25 in the Eddy era)
position_endstop: 350
position_max: 350
homing_speed: 40           # sensorless; 20 gave a narrow StallGuard window (false stops at start)
homing_retract_dist: 0     # sensorless: no second bump (macros back off instead)
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
diag_pin: ^PG9
driver_SGTHRS: 80          # same window as X: 60-100 clean, >=120 false
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   Z STEPPERS (4-point gantry lift)
#####################################################################

[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
# endstop_pin: PG10
# Position of endstop relative to bed in mm. 5 means that the endstop is 5mm above the bed.
# position_endstop: 2.7
position_min: -10
position_max: 310
homing_speed: 8
homing_retract_dist: 0      # required by the Cartographer plugin (was 3 with the Eddy)

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


[stepper_z1]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


[stepper_z2]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


[stepper_z3]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   BED HEATER
#####################################################################

[heater_bed]
heater_pin: PA3
sensor_pin: PF3
sensor_type: Generic 3950
max_power: 0.5   # 1000W 110V pad on 350mm bed: Voron rule 0.4 W/cm^2 ~ 490W
min_temp: 0
max_temp: 130
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

#####################################################################
#   FAN (ELECTRONICS BAY)
#####################################################################

[controller_fan electronics_fan]
pin: PD12
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
# fan_speed: 1.0  # You can lower this (e.g., 0.6) if the fan is too loud
idle_timeout: 1  # Time in minutes to keep running after printer stops
idle_speed: 0.5   # Speed to run at when printer is idle but motors are enabled
heater: heater_bed, extruder
stepper: stepper_x, stepper_y, stepper_z

#####################################################################
#   IDLE TIMEOUT
#####################################################################

[idle_timeout]
timeout: 3600


#####################################################################
#   QUAD GANTRY LEVEL
#####################################################################

[quad_gantry_level]
gantry_corners:
  -60,-10
  410,420
#  Probe points
points:
  # 50,25
  # 50,275
  # 300,275
  # 300,25
    # Nozzle coordinates (Klipper adds the probe offset). Eddy (-47,-7) used 97,32 / 97,282 / 347,282 / 347,32.
    # Cartographer (0,+21.1): the coil lands at Y 26 / 316. X/Y min 0 since 2026-10-17, so the points spread wider.
    30, 5
    30, 295
    320,295
    320,5
speed: 100
horizontal_move_z: 2
retries: 5
retry_tolerance: 0.0075 # Voron default (user's choice, 2026-10-20). The front-right Z corner wanders +/-0.015 between passes until its Z drive is fixed, so QGL can run out of retries and cancel a print before it extrudes
max_adjust: 20

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    SAVE_GCODE_STATE NAME=STATE_QGL
    BED_MESH_CLEAR
    # If QGL has not been done yet, correct for any major skew first
    # at 8mm height
    {% if not printer.quad_gantry_level.applied %}
    _QUAD_GANTRY_LEVEL horizontal_move_z=8 retry_tolerance=1      
    {% endif %}
    # Complete with a full QGL at the configured height
    _QUAD_GANTRY_LEVEL
    RESTORE_GCODE_STATE NAME=STATE_QGL

