#####################################################################
#   MCU DEFINITIONS
#####################################################################

[mcu]
canbus_uuid: 8aad5b6575b6

[include mainsail.cfg]

[include macros.cfg]

[include ebb-sb-can.cfg]

[include eddy-ng.cfg]


#####################################################################
#   PRINTER KINEMATICS / LIMITS
#####################################################################


[printer]
kinematics: corexy
max_velocity: 400   # 500 tested clean on all corners @ accel 3000 (2026-10-04)
max_accel: 3000
max_z_velocity: 20
max_z_accel: 1550
square_corner_velocity: 5.0

# Object labels for adaptive bed mesh + per-object cancel
# (slicer: Label objects = Firmware-specific; Moonraker object processing is the fallback)
[exclude_object]

#####################################################################
#   INPUT SHAPER
#####################################################################

[input_shaper]
#shaper_freq_x: 54.6
#shaper_type_x: mzv
#shaper_freq_y: 40.8
#shaper_type_y: zv
#shaper_freq_y: 47.4
#shaper_type_y: mzv


#####################################################################
#   Extruder
#####################################################################

[extruder]
step_pin: EBBCan:gpio18
dir_pin: EBBCan:gpio19
enable_pin: !EBBCan:gpio17
microsteps: 16
# CW2/BMG gears are 50:10 (5:1). Either set the ratio, or bake it into rotation_distance.
gear_ratio: 50:10
# rotation_distance: 22.678
# rotation_distance: 23.87
# rotation_distance: 25.94
rotation_distance: 21.96
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan:gpio7
# sensor_type: EPCOS 100K B57560G104F  #Dragon UHF
sensor_type: PT1000 #NextG Fiber.
sensor_pin: EBBCan:gpio27
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 350
max_extrude_only_distance: 150   # allows 100mm extruder calibration + load/unload macros
# Ellis PA pattern, 0.4 nozzle, Silk PLA 210C, 100 mm/s @ 3000 (2026-10-05) -> 0.025.
# (An earlier 0.02 was measured with a 0.6 nozzle fitted by mistake; void.)
pressure_advance: 0.025

[tmc2209 extruder]
uart_pin: EBBCan:gpio20      
run_current: 0.60            # LDO 36STH20-1004AHG (CW2). Was 1.00 (inherited): toolhead board hit 64C in a PLA print. Voron default 0.5
hold_current: 0.25
sense_resistor: 0.110
stealthchop_threshold: 0     # force spreadCycle for consistent torque
interpolate: True


#####################################################################
#   X / Y STEPPERS
#####################################################################

[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: PG6
position_min: 30   # was 15 -> 25 -> 30; toolhead bumps the front-left at speed below X30 (verified 2026-10-04)
position_endstop: 350
position_max: 350
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: PG9
position_min: 25   # was 6; keep toolhead clear of the front (2026-10-04)
position_endstop: 350
position_max: 350
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   Z STEPPERS (4-point gantry lift)
#####################################################################

[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
# endstop_pin: PG10
# Position of endstop relative to bed in mm. 5 means that the endstop is 5mm above the bed.
# position_endstop: 2.7
position_min: -10
position_max: 310
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


[stepper_z1]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


[stepper_z2]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


[stepper_z3]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   BED HEATER
#####################################################################

[heater_bed]
heater_pin: PA3
sensor_pin: PF3
sensor_type: Generic 3950
max_power: 0.5   # 1000W 110V pad on 350mm bed: Voron rule 0.4 W/cm^2 ~ 490W
min_temp: 0
max_temp: 130
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

#####################################################################
#   FAN (ELECTRONICS BAY)
#####################################################################

[controller_fan electronics_fan]
pin: PD12
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
# fan_speed: 1.0  # You can lower this (e.g., 0.6) if the fan is too loud
idle_timeout: 1  # Time in minutes to keep running after printer stops
idle_speed: 0.5   # Speed to run at when printer is idle but motors are enabled
heater: heater_bed, extruder
stepper: stepper_x, stepper_y, stepper_z

#####################################################################
#   IDLE TIMEOUT
#####################################################################

[idle_timeout]
timeout: 3600


#####################################################################
#   QUAD GANTRY LEVEL
#####################################################################

[quad_gantry_level]
gantry_corners:
  -60,-10
  410,420
#  Probe points
points:
  # 50,25
  # 50,275
  # 300,275
  # 300,25
    97, 32
    97, 282
    347,282
    347,32
speed: 100
horizontal_move_z: 2
retries: 5
retry_tolerance: 0.02   # was 0.0075; Eddy drifts while it warms, 0.0075 unreachable without a long soak (2026-10-04)
max_adjust: 20

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    SAVE_GCODE_STATE NAME=STATE_QGL
    BED_MESH_CLEAR
    # If QGL has not been done yet, correct for any major skew first
    # at 8mm height
    {% if not printer.quad_gantry_level.applied %}
    _QUAD_GANTRY_LEVEL horizontal_move_z=8 retry_tolerance=1      
    {% endif %}
    # Complete with a full QGL at the configured height
    _QUAD_GANTRY_LEVEL
    RESTORE_GCODE_STATE NAME=STATE_QGL

