#####################################################################
#   CPAP part-cooling blower (Mellow WS7040 + WS2403DY01V04 driver) - 2026-10-23
#####################################################################
# Power: driver red/black straight to the 24 V PSU (not a fan header; rated ~2.7 A).
# Speed: driver VSR (the pot's wiper pin; pot removed) -> Octopus STOP_7 signal (PG15),
#        driver GND -> STOP_7 GND. Driver VCC (pot supply), EN (purple), FR (green): unconnected.
# FG (white, tach) not connected yet; candidate pin PG11 (STOP_3) once its voltage is checked.
# PG15 is shared with MOTOR7's DIAG through a jumper: keep that jumper OFF.
# The endstop port pulls PG15 high, so the blower runs FULL whenever Klipper isn't driving the
# pin (boot, firmware restart, shutdown) - expect a short blast on every restart.
# A 3.3 V signal into a 0-5 V speed input caps the top speed at roughly two thirds.
# Test fan for now; it becomes [fan] (the print part fan) when the Xol toolhead + XolPAP duct go on.

[fan_generic cpap]
pin: PG15
cycle_time: 0.005          # 200 Hz software PWM, Mellow's example config
hardware_pwm: False
max_power: 1.0
shutdown_speed: 0
