#####################################################################
#   BTT SFS V2.0 (Smart Filament Sensor) - 2026-10-18
#####################################################################
# Frame-mounted on the filament path (spool side of the extruder), wired to the
# Octopus endstop header as in BTT's SFS V2.0 + Octopus diagram:
#   5V, GND, PG12 = runout switch, PG13 = motion encoder (one pulse per ~2.88 mm).
# PG6/PG9 belong to sensorless homing (DIAG jumpers); PG10 is the old Z switch port.
#
# Both sensors pause the print (Mainsail's PAUSE parks the head). They only act while
# printing; SET_FILAMENT_SENSOR SENSOR=<name> ENABLE=0 turns one off for a job.
# Include this file only when filament runs through the sensor: with an empty sensor
# the motion check sees the extruder turning without pulses and pauses at once.

[filament_switch_sensor sfs_runout]
switch_pin: ^PG12
pause_on_runout: True
runout_gcode:
    M117 Filament runout
    RESPOND TYPE=error MSG="SFS: filament runout - print paused"
insert_gcode:
    M117 Filament inserted
    RESPOND MSG="SFS: filament inserted"

[filament_motion_sensor sfs_motion]
switch_pin: ^PG13
extruder: extruder
# BTT quotes 2.88 mm (the pulse spacing); that false-triggers in practice (Voron forum:
# BTT suggest 7, users settle around 10). Retractions, tube slack and the 0.3 mm firmware
# retract all move less than this without a pulse.
detection_length: 10
pause_on_runout: True
runout_gcode:
    M117 Filament jam?
    RESPOND TYPE=error MSG="SFS: no filament movement for 10 mm of extrusion (jam, grinding or tangle) - print paused"
insert_gcode:
    RESPOND MSG="SFS: filament moving again"
