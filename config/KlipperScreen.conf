# KlipperScreen on the Mellow FLY-HDMI 7" (1024x600 IPS, capacitive touch over USB), added 2026-11-04.
# Wiring: screen HDMI -> the Pi 4's HDMI0 (micro-HDMI next to the USB-C power jack); screen Type-C
# -> a Pi USB port with a data-capable cable (touch + the screen's 5 V). Mounted landscape, no
# rotation config. The screen also has its own rotate key (untested here: check that touch follows).
#
# KlipperScreen reads ~/printer_data/config/KlipperScreen.conf. Settings changed on the screen are
# saved by KlipperScreen in the Pi's copy, below a "#~# --- Do not edit below this line" marker, so
# pull that block back here before mirroring this file to the Pi (like printer.cfg's SAVE_CONFIG).
# KlipperScreen's parser keeps inline comments as part of the value: comments go on their own lines,
# and without square brackets (it rejects any line holding a bracketed word as a bad section header).

[main]
# Seconds (15 min). Changing it on the screen saves an override in the auto-generated block below.
screen_blanking: 900

[printer Voron 2.4]
moonraker_host: 127.0.0.1
moonraker_port: 7125
# Coil temperature in the title bar: the scan height drifts ~0.02 mm/C (PRINT_START notes)
titlebar_items: cartographer_coil

# Preheats = the slicer's first-layer temps (PrusaSlicer "@Voron24" / "@ Voron" filament profiles,
# 2026-11-04). Any preheat section replaces KlipperScreen's built-in list.
[preheat PLA]
extruder: 205
heater_bed: 55

[preheat PETG]
extruder: 240
heater_bed: 65

[preheat ASA]
extruder: 255
heater_bed: 100

# Cooldown turns the heaters off itself; this adds the CPAP (part fan) off.
[preheat cooldown]
gcode: M107
#~# --- Do not edit below this line. This section is auto generated --- #~#
#~#
#~# [main]
#~# screen_blanking = 900
#~#
