#####################################################################
#   TOOLHEAD: StealthBurner + BTT EBB SB2209 (RP2040) + SB0000 front PCB
#####################################################################
# Everything that belongs to the toolhead lives in one file, so switching toolheads is one
# include line in printer.cfg (toolhead-stealthburner.cfg <-> toolhead-xol.cfg).
#
# Hardware: StealthBurner with a CPAP front (2026-10-25; the 5015 is gone), Clockwork 2
# (LDO 36STH20-1004AHG, 50:10), NextG Fiber hotend with PT1000, 0.4 nozzle, EBB SB2209 (RP2040)
# + SB0000, Cartographer V4 on the Cartographer CNC Stealthburner mount (CAN via the SB0000 port).
# LEDs on the SB0000 are dead (2026-10-30; replacement RGBW set not fitted).
#
# Kept HERE, not in printer.cfg's SAVE_CONFIG block, so they survive a toolhead swap:
#   hotend PID, input shaper, max_accel, probe offsets, Cartographer model names (_TOOLHEAD).
#   Klipper refuses SAVE_CONFIG for a value that is also set here, so after PID_CALIBRATE or
#   SHAPER_CALIBRATE copy the results into this file instead. Cartographer models are saved
#   with SAVE_CONFIG under this toolhead's names (sb, sb_asa, sb_pla), so both sets coexist.
#
# AFTER SWAPPING TO THIS TOOLHEAD:
#   1. printer.cfg: [include toolhead-stealthburner.cfg], then FIRMWARE_RESTART; all MCUs connect.
#   2. The Cartographer was moved between mounts, so its height changed: paper test at bed 100 /
#      nozzle 150 (CARTOGRAPHER_SCAN_CALIBRATE MODEL=sb_asa), CARTOGRAPHER_TOUCH_CALIBRATE MODEL=sb,
#      SAVE_CONFIG, then a touch check (CARTOGRAPHER_TOUCH_ACCURACY) and one first-layer patch.
#   3. Pressure advance is per toolhead: the slicer's filament values are for the Stealthburner.
#   PID, input shaper and extruder values below carry over (same hardware as before the swap).
# Not toolhead-specific (stay elsewhere): part fan (CPAP, cpap.cfg), firmware retraction,
# brush wipe height (NOZZLE_CLEAN wipe_z), Cartographer MCU (cartographer.cfg).

[gcode_macro _TOOLHEAD]
description: This toolhead's name and Cartographer models (loaded at startup and by PRINT_START)
variable_name: 'stealthburner'
variable_touch: 'sb'            # touch model
variable_scan_asa: 'sb_asa'     # scan model for bed >= 90 (ASA/ABS)
variable_scan_pla: 'sb_pla'     # scan model for bed < 90 (PLA); not calibrated yet
gcode:
    RESPOND MSG="Toolhead: {printer['gcode_macro _TOOLHEAD'].name}"

[printer]
max_accel: 4000      # 2026-10-21: Y shaper mzv 38.0 allows <= 4300 (X <= 8000); skip test 4000/5000 @ 400 mm/s clean (was 3000, Y-limited at 2900)

[input_shaper]
# 2026-10-21, after re-tightening the toolhead (moved here from SAVE_CONFIG 2026-10-31)
shaper_type_x: mzv
shaper_freq_x: 52.0
shaper_type_y: mzv
shaper_freq_y: 38.0

[mcu EBBCan]
# canbus_uuid: e6bd045b7fc9   # old EBB, replaced 2026-10-01
# canbus_uuid: d6a9ca313b41   # 2nd EBB, replaced 2026-10-28 (LEDs dead, 5 V couldn't carry the KNOMI)
canbus_uuid: 79eb2ef224a8     # 3rd EBB (v1.0.1), Katapult + Klipper 2026-10-28
canbus_interface: can0

[temperature_sensor EBB_NTC]
sensor_type: Generic 3950
sensor_pin: EBBCan:gpio28

#####################################################################
#   Extruder + hotend
#####################################################################

[extruder]
step_pin: EBBCan:gpio18
dir_pin: EBBCan:gpio19
enable_pin: !EBBCan:gpio17
microsteps: 16
# CW2/BMG gears are 50:10 (5:1). Either set the ratio, or bake it into rotation_distance.
gear_ratio: 50:10
rotation_distance: 21.96
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan:gpio7
sensor_type: PT1000          # NextG Fiber
sensor_pin: EBBCan:gpio27
control: pid                 # 245 C, 2026-10-01 (moved here from SAVE_CONFIG 2026-10-31)
pid_Kp: 26.552
pid_Ki: 2.107
pid_Kd: 83.640
min_temp: 0
max_temp: 350
max_extrude_only_distance: 150   # allows 100mm extruder calibration + load/unload macros
min_extrude_temp: 140            # PRINT_START retracts 1 mm at the 150 C touch temp (default 170); same as the SV08
# Default = regular PLA (Ellis pattern, 0.4 nozzle, 205C, 100 mm/s @ 3000, 2026-10-06): 0.035.
# Per-filament values live in the PrusaSlicer filament start gcode (PLA 0.035, Silk PLA 0.025, ASA 0.02).
pressure_advance: 0.035

[tmc2209 extruder]
uart_pin: EBBCan:gpio20
run_current: 0.60            # LDO 36STH20-1004AHG (CW2). Was 1.00 (inherited): toolhead board hit 64C in a PLA print. Voron default 0.5
hold_current: 0.25
sense_resistor: 0.110
stealthchop_threshold: 0     # force spreadCycle for consistent torque
interpolate: True

#####################################################################
#   Fans, LEDs
#####################################################################

# Part fan: the CPAP, [fan] in cpap.cfg. EBBCan:gpio13 (SB0000 VFAN2) was the old 5015, now unused.

[heater_fan hotend_fan]
pin: EBBCan:gpio14
heater: extruder
heater_temp: 50.0

[fan_generic 4W_FAN0]
pin: EBBCan:gpio15
tachometer_pin: EBBCan:gpio12

[neopixel led]
pin: EBBCan:gpio16          # BTT SB2209 RP2040 pin diagram: RGB = GPIO16 -> SB0000 plug (GND, RGB, +5V)
# FYSETC Stealthburner kit (2026-10-06): 3x NeoPixel RGBW mini-button PCBs (SK6812), logo first.
# (Was chain_count 10 / GRB x9 + GRBW for an old Rainbow Barf logo PCB.)
chain_count: 3
# 2026-10-30: replacement RGBW mini button PCB set (logo + 2 nozzle, XHB2.54 3P), GRBW like the
# FYSETC kit. The interim LEDs were RGB (GRB) with a dead green on the logo and dark nozzle LEDs.
# Mixed chains take a per-LED list, e.g. color_order: GRB, GRBW, GRBW.
color_order: GRBW
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0
initial_WHITE: 0.0
# logo = index 1, nozzle = indices 2,3

#####################################################################
#   Accelerometer (on the toolboard)
#####################################################################

[adxl345]
cs_pin: EBBCan:gpio1
spi_software_sclk_pin: EBBCan:gpio2
spi_software_mosi_pin: EBBCan:gpio0
spi_software_miso_pin: EBBCan:gpio3
axes_map: z,-y,x

[resonance_tester]
probe_points: 175, 175, 20   # bed centre (Klipper recommendation)
accel_chip: adxl345
accel_chip_z: adxl345

#####################################################################
#   Probe position (depends on the probe mount; merged into [cartographer] in cartographer.cfg)
#####################################################################

[cartographer]
# Cartographer CNC Stealthburner mount: placeholder offsets (Cartographer publishes none for this
# mount; a few mm off only shifts the mesh, Z0 comes from touch). Ruler-check when convenient.
x_offset: 0
y_offset: 21.1
